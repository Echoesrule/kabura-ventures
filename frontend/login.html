<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kabura Ventures</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256x256.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css?v=9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="no-nav">
    <div class="auth-bg-iframe" aria-hidden="true">
        <iframe src="/" tabindex="-1"></iframe>
    </div>
    <main class="auth-page">
        <div class="auth-split-wrapper">
            <div class="auth-card">
                <div class="auth-left">
                    <div class="auth-brand">
                        <img src="/assets/images/kabura-logo.png" alt="Kabura" class="auth-logo" loading="lazy">
                        <h1>Welcome Back</h1>
                        <p class="auth-sub">Sign in to manage bookings and discover tours.</p>
                    </div>

                    <div class="auth-toggle" role="tablist" aria-label="Auth switch">
                        <button class="auth-tab active" data-target="login-panel">Login</button>
                        <button class="auth-tab" data-target="register-panel">Sign Up</button>
                        <div class="auth-slider"></div>
                    </div>

                    <div class="socials">
                        <button class="soc-btn soc-btn-text" onclick="signInWithGoogle()" title="Continue with Google" aria-label="Continue with Google">
                            <i class="fa-brands fa-google"></i>
                            <span>Continue with Google</span>
                        </button>
                    </div>

                    <div class="or-sep">or</div>

                    <div class="auth-panels">
                        <form id="login-form" class="auth-form auth-panel" data-panel="login-panel">
                            <div class="form-group">
                                <label class="form-label">Username or Email</label>
                                <input type="text" class="form-input" id="login-identifier" required placeholder="Username or email">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Password</label>
                                <div class="password-wrapper">
                                    <input type="password" class="form-input" id="login-password" required placeholder="Your password">
                                    <button type="button" class="password-toggle" tabindex="-1" aria-label="Show password" onclick="togglePassword(this)">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="auth-cta-row">
                                <button type="submit" class="btn btn-primary btn-lg auth-cta">Login</button>
                                <button type="submit" class="auth-cta-arrow" aria-label="Login">
                                    <img src="/assets/images/right-arrow.png" alt="" class="auth-cta-arrow-img" loading="lazy">
                                </button>
                            </div>
                            <p class="auth-note" style="text-align:center;margin-top:0.5rem;">
                                <a href="#" onclick="event.preventDefault();showForgotPasswordForm();" style="color:var(--text-secondary);font-size:0.85rem;">Forgot Password?</a>
                            </p>
                            <p class="auth-note">Don't have an account? <a href="#" class="switch-to" data-target="register-panel">Sign Up</a></p>
                        </form>

                        <form id="register-form" class="auth-form auth-panel" data-panel="register-panel" style="display:none;">
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-input" id="reg-name" required placeholder="Your full name">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-input" id="reg-email" required placeholder="you@domain.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-input" id="reg-phone" placeholder="Optional phone">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Password</label>
                                <div class="password-wrapper">
                                    <input type="password" class="form-input" id="reg-password" minlength="6" required placeholder="Create a password">
                                    <button type="button" class="password-toggle" tabindex="-1" aria-label="Show password" onclick="togglePassword(this)">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <div class="password-strength" id="reg-password-strength-meter">
                                    <div class="password-strength-bar">
                                        <div class="password-strength-fill" id="reg-password-strength-fill"></div>
                                    </div>
                                    <span class="password-strength-label" id="reg-password-strength-label"></span>
                                </div>
                            </div>
                            <div class="auth-cta-row">
                                <button type="submit" class="btn btn-primary btn-lg auth-cta">Sign Up</button>
                                <button type="submit" class="auth-cta-arrow" aria-label="Sign Up">
                                    <img src="/assets/images/right-arrow.png" alt="" class="auth-cta-arrow-img" loading="lazy">
                                </button>
                            </div>
                            <p class="auth-note">Already have an account? <a href="#" class="switch-to" data-target="login-panel">Log in</a></p>
                        </form>
                    </div>
                </div>
                <div class="auth-right" role="img" aria-label="Scenic view">
                    <img id="auth-hero-image" src="" alt="Hero" class="auth-hero-img" loading="lazy">
                    <div class="auth-overlay">
                        <div class="overlay-bubble" id="auth-hero-caption"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/assets/js/supabase-client.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/components.js"></script>
    <script src="/assets/js/app.js"></script>
</body>
</html>
