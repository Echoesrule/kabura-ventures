<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - Kabura Ventures</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256x256.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css?v=11">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/wishlist.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <section class="wishlist-hero">
        <div class="wishlist-hero-bg">
            <img src="/assets/images/safari.jpg" alt="" loading="eager">
            <div class="wishlist-hero-overlay"></div>
        </div>
        <div class="wishlist-hero-inner">
            <div class="wishlist-hero-eyebrow">My collections</div>
            <h1>Your Wishlist</h1>
            <p>All your saved tours and hotels in one place.</p>
            <div class="wishlist-hero-btn-row">
                <a href="/tours.html" class="hp-section-btn hp-section-btn--white">Browse Tours</a>
                <a href="/tours.html" class="hp-section-btn-arrow hp-section-btn-arrow--white" aria-label="Browse Tours">
                    <img src="/assets/images/right-arrow.png" alt="" class="hp-section-btn-arrow-img" loading="lazy">
                </a>
            </div>
        </div>
    </section>

    <section class="wishlist-section">
        <div class="container">
            <div class="wishlist-tabs">
                <button class="wishlist-tab active" data-tab="all" onclick="switchTab('all')">All <span id="count-all">0</span></button>
                <button class="wishlist-tab" data-tab="tours" onclick="switchTab('tours')">Tours <span id="count-tours">0</span></button>
                <button class="wishlist-tab" data-tab="hotels" onclick="switchTab('hotels')">Hotels <span id="count-hotels">0</span></button>
            </div>
            <div id="wishlist-container"></div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/assets/js/supabase-client.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/components.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/wishlist.js"></script>
</body>
</html>
